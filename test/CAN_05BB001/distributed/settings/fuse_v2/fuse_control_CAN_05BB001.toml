# FUSE control file for CAN_05BB001

[filepaths]
settings_dir = "test/CAN_05BB001/distributed/settings/fuse_v2/"
input_dir    = "test/CAN_05BB001/lumped/input/"
output_dir   = "test/CAN_05BB001/distributed/output/"

[input]
hydromet_suffix   = "_daymet_qobs_merged_legacy.nc"
elevbands_suffix = "_elev_bands.nc"

[model]
constraints_file = "fuse_zConstraints_snow.txt"
numerics_file    = "fuse_zNumerix.txt"
decisions_file   = "fuse_zDecisions_2.txt"

[forcing_coords]
time      = "time"
latitude  = "latitude"
longitude = "longitude"

[hydromet_vars]
precip = "prcp"
temp   = "temp"
pet    = "pet_oudin"
qobs   = "runoff_obs"

[output]

write_timeseries = true

model_id  = "2"

variables = [
  "q_instnt",
  "q_routed",
  "q_reach",
  "q_obs"
]

[run_periods]
date_start_sim  = "1987-01-02"
date_end_sim    = "2009-12-31"
date_start_eval = "1989-01-01"
date_end_eval   = "1999-01-31"
numtim_sub_str  = "-9999"

[calibration]
metric  = "KGE"
transfo = "1"

[sce]
maxn   = 10000
kstop  = 3
pcento = 0.001

[mizuRoute]

namelist_path = "test/CAN_05BB001/distributed/settings/mizuRoute/"
namelist_file = "param.nml.default"

methods = "3"

dt = 3600

[hydrofabric]

hfabric_path = "test/CAN_05BB001/distributed/input/"
hfabric_file = "hydrofabric_mizuRoute.nc"
hfabric_newfile = "hydrofabric_mizuRoute_new.nc"

dname_seg = "seg"
dname_hru = "hru"

varname_HRUid     = "hruId"
varname_segId     = "segId"
varname_hruSegId  = "hruSegId"
varname_downSegId = "NextDownID"

varname_area   = "area"
varname_slope  = "slope"
varname_length = "length"

seg_outlet = 710285850

[remapping]

remap_file     = "lumped_to_hru.nc"

dname_hru      = "polyid"
dname_data     = "data"

vname_hruid    = "polyid"
vname_weight   = "weight"
vname_num_qhru = "nOverlaps"
vname_i_index  = "i_index"
vname_j_index  = "j_index"

